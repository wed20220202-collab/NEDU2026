<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>根津小学校記念画像</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.0/openseadragon.min.css"/>
  <style>
    body{margin:0;background:#111;color:#fff;font-family:sans-serif;height:100vh;display:flex;flex-direction:column}
    header{padding:10px;background:#222;text-align:center;font-size:1.2rem}
    #controls{background:#222;text-align:center;padding:8px;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
    select{padding:8px 12px;border-radius:6px;border:none;font-size:1rem;background:#333;color:#fff;cursor:pointer;transition:background .2s}
    select:hover{background:#444}
    #openseadragon{flex:1}
    .btn{padding:8px 12px;border-radius:6px;border:none;background:#444;color:#fff;cursor:pointer}
  </style>
</head>
<body>

<script>
function kick(){
  location.replace("index.html");
}

(function guard(){
  if(sessionStorage.getItem("loginOK") !== "1") kick();

  const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
  const ttl = Number(sessionStorage.getItem("ttl") || "0");
  if(!loginAt || !ttl) kick();

  if(Date.now() - loginAt > ttl){
    sessionStorage.clear();
    kick();
  }

  if(!sessionStorage.getItem("sid")) kick();
})();

// 自動ログアウト
const ttl = Number(sessionStorage.getItem("ttl") || "0");
const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
const remain = Math.max(0, ttl - (Date.now() - loginAt));
setTimeout(()=>{
  sessionStorage.clear();
  kick();
}, remain);

function logout(){
  sessionStorage.clear();
  location.replace("index.html");
}
</script>

  <header>２６卒　根津小学校記念画像</header>
  <div id="controls">
    <label for="imageSelect">画像を選択：</label>
    <select id="imageSelect">
      <option value="0">根津小学校</option>
    </select>

    <button class="btn" onclick="downloadImage()">Download</button>

    <button class="btn" onclick="logout()">ログアウト</button>
  </div>

  <div id="openseadragon"></div>

  <script>
    const dziList = [
      "1225.dzi",
    ];

    const viewer = OpenSeadragon({
      id: "openseadragon",
      prefixUrl: "https://unpkg.com/openseadragon@4.1.0/build/openseadragon/images/",
      tileSources: dziList[0],
      showNavigator: true,
      defaultZoomLevel: 1,
      minZoomLevel: 0.5,
      maxZoomLevel: 75,
      crossOriginPolicy: "Anonymous"
    });

    function fitToWidth() {
      const viewport = viewer.viewport;
      if (!viewport || viewer.world.getItemCount() === 0) return;
      const item = viewer.world.getItemAt(0);
      const imageWidth = item.getContentSize().x;
      const containerWidth = viewer.container.clientWidth;
      const zoom = viewport.imageToViewportZoom(containerWidth / imageWidth);
      viewport.zoomTo(zoom, null, true);
      viewport.panTo(viewport.getHomeBounds().getCenter());
    }

    viewer.addHandler("open", fitToWidth);
    viewer.addHandler("home", fitToWidth);

    document.getElementById("imageSelect").addEventListener("change", (e) => {
      const index = parseInt(e.target.value, 10);
      viewer.open(dziList[index]);
    });
  </script>

</body>
</html>
