<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>謝恩会チャット</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #111;
  color: #fff;
}

#login, #chat {
  display: none;
  padding: 20px;
}

#login {
  display: block;
  text-align: center;
  margin-top: 40vh;
}

input, button {
  padding: 10px;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

button {
  background: #4caf50;
  color: #fff;
  cursor: pointer;
}

#messages {
  height: 70vh;
  overflow-y: auto;
  padding-bottom: 10px;
}

.message {
  background: #222;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 6px;
}

.name {
  font-size: 12px;
  color: #aaa;
}

img {
  max-width: 100%;
  border-radius: 6px;
  margin-top: 6px;
}

#inputArea {
  display: flex;
  gap: 5px;
}

#inputArea input[type="text"] {
  flex: 1;
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
  <h2>謝恩会チャット</h2>
  <input id="nameInput" placeholder="名前を入力"><br><br>
  <button onclick="login()">入室</button>
</div>

<!-- チャット -->
<div id="chat">
  <div id="messages"></div>

  <div id="inputArea">
    <input type="file" id="imageInput" accept="image/*">
    <input type="text" id="messageInput" placeholder="メッセージ">
    <button onclick="sendMessage()">送信</button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC6XIodJTU56zFgvkIy3EuK139WmGvW4c4",
  authDomain: "thanks-chat-1f1af.firebaseapp.com",
  projectId: "thanks-chat-1f1af",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userName = "";

/* ログイン */
window.login = () => {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return alert("名前を入力してください");

  userName = name;
  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";
};

/* 画像圧縮 */
function compressImage(file, maxWidth = 800, quality = 0.6) {
  return new Promise(resolve => {
    const reader = new FileReader();
    const img = new Image();

    reader.onload = e => {
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const scale = Math.min(maxWidth / img.width, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* 送信 */
window.sendMessage = async () => {
  const textInput = document.getElementById("messageInput");
  const imageInput = document.getElementById("imageInput");

  const text = textInput.value.trim();
  const file = imageInput.files[0];
  if (!text && !file) return;

  let image = "";
  if (file) {
    if (file.size > 3 * 1024 * 1024) {
      alert("画像が大きすぎます");
      return;
    }
    image = await compressImage(file);
  }

  await addDoc(collection(db, "messages"), {
    name: userName,
    text,
    image,
    time: serverTimestamp()
  });

  textInput.value = "";
  imageInput.value = "";
};

/* 受信 */
const q = query(collection(db, "messages"), orderBy("time"));
onSnapshot(q, snapshot => {
  const messages = document.getElementById("messages");
  messages.innerHTML = "";

  snapshot.forEach(doc => {
    const d = doc.data();
    let html = `<div class="message">
      <div class="name">${d.name}</div>
      <div>${d.text || ""}</div>`;

    if (d.image) {
      html += `<img src="${d.image}">`;
    }

    html += `</div>`;
    messages.innerHTML += html;
  });

  messages.scrollTop = messages.scrollHeight;
});
</script>

</body>
</html>
