<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🌸動画サイト🌸</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0e0e10;
  font-family:"Segoe UI",sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.card{
  background:rgba(30,30,32,.85);
  padding:40px 35px;
  border-radius:16px;
  box-shadow:0 0 25px rgba(0,0,0,.6);
  width:360px;
  text-align:center;
}
button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#4e7fff,#335dff);
  color:#fff;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}
button.secondary{background:#444}
input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:2px solid #4e7fff;
  background:#1d1d20;
  color:#fff;
  margin-bottom:10px;
}
.small{opacity:.75;font-size:12px;margin-top:10px}
.error{color:#ff7474;display:none}
</style>
</head>

<body>

<div class="card">

  <h2 id="title">login画面</h2>
  <div id="counter" class="small">👀 読み込み中…</div>

  <!-- 🔐 ログインエリア -->
  <div id="loginArea">
    <input id="pw" type="password" placeholder="パスワードを入力">
    <button onclick="login()">ログイン</button>
    <div id="err" class="error">パスワードが違います</div>
    <div class="small">
      ※6年生の担任の名前を1組2組つなげて入力<br>
      ※ヘボン式
    </div>
  </div>

  <!-- 🔓 ログイン後エリア -->
  <div id="menuArea" style="display:none">
    <button onclick="go('movie.html')">🎬 動画を開く</button>
    <button class="secondary" onclick="go('viewer.html')">🖼 画像ビューアを開く</button>
    <div class="small">※タブを閉じるとログアウトします</div>
  </div>

</div>

<script>
/* ===== ログイン設定 ===== */
const PASSWORD_HASH =
  "281e62e280f2a9afd1444376c9d86ce60c7463169cda41206eb7990f2a1882fd";
const SESSION_TTL_MS = 20 * 60 * 1000;

async function sha256(text){
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function login(){
  const pw = document.getElementById("pw").value.trim();
  const hash = await sha256(pw);
  if(hash !== PASSWORD_HASH){
    document.getElementById("err").style.display="block";
    return;
  }

  sessionStorage.setItem("loginOK","1");
  sessionStorage.setItem("loginAt",Date.now());
  showMenu();
}

function showMenu(){
  document.getElementById("loginArea").style.display="none";
  document.getElementById("menuArea").style.display="block";
  document.getElementById("title").textContent="メニュー";
}

function go(to){
  logAfterLogin(to);
  location.href = to;
}

if(sessionStorage.getItem("loginOK")==="1"){
  showMenu();
}
</script>

<!-- ===== Firebase ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, runTransaction,
  collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBBpOKnLNBz0qikWgl6zAGpRG8_o0LZEEc",
  authDomain: "endlees-accescounter.firebaseapp.com",
  projectId: "endlees-accescounter"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 公開設定チェック */
const cfgSnap = await getDoc(doc(db,"stats","config"));
if(cfgSnap.exists() && cfgSnap.data().publish === false){
  document.body.innerHTML = "<h2>現在このサイトは非公開です</h2>";
  throw new Error("closed");
}

/* アクセスカウンタ */
const counterEl = document.getElementById("counter");
const counterRef = doc(db,"stats","access");

if(!sessionStorage.getItem("counted")){
  await runTransaction(db, async(tx)=>{
    const s = await tx.get(counterRef);
    const c = s.exists()?s.data().count:0;
    tx.set(counterRef,{count:c+1},{merge:true});
  });
  sessionStorage.setItem("counted","1");
}
const s = await getDoc(counterRef);
counterEl.textContent = `👨‍👩‍👧‍👦 このページを開いた回数： ${s.data().count} 回`;

/* ログ */
let anonId = localStorage.getItem("anon_id");
if(!anonId){
  anonId="anon_"+crypto.randomUUID();
  localStorage.setItem("anon_id",anonId);
}
window.logAfterLogin = async (to)=>{
  await addDoc(collection(db,"access_logs"),{
    anonId,
    page:"index",
    to,
    time:serverTimestamp(),
    userAgent:navigator.userAgent
  });
};
</script>

</body>
</html>
