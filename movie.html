<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Protected Movie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#0e0e10;color:#fff;font-family:"Segoe UI",sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
video{width:92vw;max-width:900px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,.6)}
button{padding:10px 18px;font-size:16px;border-radius:8px;background:#444;color:#fff;border:none;cursor:pointer}
.small{opacity:.7;font-size:12px}
</style>
</head>
<body oncontextmenu="return false">

<script>
function kick(){
  location.replace("index.html");
}

(function guard(){
  if(sessionStorage.getItem("loginOK") !== "1") kick();

  const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
  const ttl = Number(sessionStorage.getItem("ttl") || "0");
  if(!loginAt || !ttl) kick();

  if(Date.now() - loginAt > ttl){
    sessionStorage.clear();
    kick();
  }

  // sidがない＝別タブ直打ち等
  if(!sessionStorage.getItem("sid")) kick();
})();

// 自動ログアウトタイマー
const ttl = Number(sessionStorage.getItem("ttl") || "0");
const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
const remain = Math.max(0, ttl - (Date.now() - loginAt));
setTimeout(()=>{
  sessionStorage.clear();
  kick();
}, remain);
</script>

<div class="wrap">
  <h2 style="margin:0">動画閲覧</h2>

  <video id="vid"
    controls
    controlsList="nodownload noplaybackrate"
    disablePictureInPicture
    oncontextmenu="return false"
  >
    <source src="movie.mp4" type="video/mp4">
  </video>

  <button onclick="logout()">ログアウト（戻る）</button>
  <div class="small">※一定時間で自動ログアウトします</div>
</div>

<script>
function logout(){
  try{
    const v = document.getElementById("vid");
    if(v){ v.pause(); v.currentTime = 0; }
  }catch(e){}
  sessionStorage.clear();
  location.replace("index.html");
}
</script>
</body>
</html>
