<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Protected Movie</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0e0e10;
  color:#fff;
  font-family:"Segoe UI",system-ui,sans-serif;
}
.wrap{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  gap:14px;
}
.drive-wrap{
  width:92vw;
  max-width:900px;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 0 20px rgba(0,0,0,.6);
  background:#000;
}
.drive-wrap iframe{
  width:100%;
  height:100%;
  border:none;
}
button{
  padding:10px 18px;
  font-size:16px;
  border-radius:8px;
  background:#444;
  color:#fff;
  border:none;
  cursor:pointer;
}
button:hover{background:#666}
.small{
  opacity:.7;
  font-size:12px;
}
</style>
</head>

<body oncontextmenu="return false">

<script>
/* ========= ガード処理 ========= */
function kick(){
  location.replace("index.html");
}

(function guard(){
  if(sessionStorage.getItem("loginOK") !== "1") kick();

  const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
  const ttl = Number(sessionStorage.getItem("ttl") || "0");

  if(!loginAt || !ttl) kick();

  if(Date.now() - loginAt > ttl){
    sessionStorage.clear();
    kick();
  }

  // 別タブ直打ち防止
  if(!sessionStorage.getItem("sid")) kick();
})();

// 自動ログアウト
const ttl = Number(sessionStorage.getItem("ttl") || "0");
const loginAt = Number(sessionStorage.getItem("loginAt") || "0");
const remain = Math.max(0, ttl - (Date.now() - loginAt));
setTimeout(()=>{
  sessionStorage.clear();
  kick();
}, remain);
</script>

<div class="wrap">
  <h2 style="margin:0">動画閲覧</h2>

  <!-- ▼ Google Drive 埋め込み -->
  <div class="drive-wrap">
    <iframe
      src="https://drive.google.com/file/d/1dKhA8lutxb6DtXksQISv_3nx1_x6Lh-R/preview"
      allow="autoplay"
      allowfullscreen
    ></iframe>
  </div>

  <button onclick="logout()">ログアウト（戻る）</button>
  <div class="small">※一定時間で自動ログアウトします</div>
</div>

<script>
function logout(){
  sessionStorage.clear();
  location.replace("index.html");
}
</script>

</body>
</html>
