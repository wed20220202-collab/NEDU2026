<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#fff;padding:20px}
button{padding:10px 14px;border:0;border-radius:10px;background:#335dff;color:#fff;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #333;padding:6px;font-size:12px;vertical-align:top}
</style>
</head>
<body>

<h2>管理画面</h2>
<div id="status">未ログイン</div>
<button id="login">管理者ログイン</button>

<h3 id="count">総アクセス数: -</h3>

<table>
<thead>
<tr><th>time</th><th>anonId</th><th>to</th><th>UA</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, orderBy, query, limit } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

// 🔥 index.html と同じ設定を必ず入れる
const firebaseConfig = {
  apiKey: "AIzaSyBBpOKnLNBz0qikWgl6zAGpRG8_o0LZEEc",
  authDomain: "endlees-accescounter.firebaseapp.com",
  projectId: "endlees-accescounter",
  storageBucket: "endlees-accescounter.firebasestorage.app",
  messagingSenderId: "70250476146",
  appId: "1:70250476146:web:cc95f3b7036fbbbc6408eb"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 🔐 ログインボタン
document.getElementById("login").onclick = async () => {
  const email = prompt("管理者メール");
  const pass  = prompt("管理者パスワード");
  if (!email || !pass) return;

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert("ログイン失敗：" + e.message);
  }
};

// 🔄 ログイン後処理
onAuthStateChanged(auth, async (user)=>{
  if(!user) return;

  document.getElementById("status").textContent =
    "ログイン中: " + user.email;

  // カウンタ
  const c = await getDoc(doc(db,"stats","access"));
  document.getElementById("count").textContent =
    "総アクセス数: " + (c.exists() ? c.data().count : 0);

  // ログ一覧（最新100件）
  const q = query(
    collection(db,"access_logs"),
    orderBy("time","desc"),
    limit(100)
  );
  const s = await getDocs(q);

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  s.forEach(d=>{
    const r = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.time?.toDate().toLocaleString() ?? ""}</td>
      <td>${r.anonId ?? ""}</td>
      <td>${r.to ?? ""}</td>
      <td style="word-break:break-all">${(r.userAgent ?? "").slice(0,120)}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
