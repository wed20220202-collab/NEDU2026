<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid #333;padding:6px;font-size:12px}
</style>
</head>
<body>

<h2>管理画面</h2>
<div id="status">未ログイン</div>
<button id="login">管理者ログイン</button>
<h3 id="count"></h3>

<table>
<thead><tr><th>time</th><th>anon</th><th>UA</th></tr></thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = { /* 同じ設定 */ };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("login").onclick = async () => {
  const email = prompt("email");
  const pass = prompt("password");
  await signInWithEmailAndPassword(auth, email, pass);
};

onAuthStateChanged(auth, async (u)=>{
  if(!u) return;
  document.getElementById("status").textContent="ログイン中";

  const c = await getDoc(doc(db,"stats","access"));
  document.getElementById("count").textContent =
    "総アクセス数: " + (c.exists()?c.data().count:0);

  const q = query(collection(db,"logs"), orderBy("time","desc"));
  const s = await getDocs(q);
  const tbody = document.getElementById("rows");
  s.forEach(d=>{
    const r=d.data();
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${r.time?.toDate()}</td><td>${r.anonId}</td><td>${r.ua}</td>`;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
