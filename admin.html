<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
h2,h3{margin-top:0}
button{
  padding:8px 14px;
  border:0;
  border-radius:8px;
  background:#335dff;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
button:hover{opacity:.9}
#logout{background:#444;margin-left:8px}
.small{opacity:.7;font-size:12px}

input{
  padding:6px;
  border-radius:6px;
  border:1px solid #333;
  background:#000;
  color:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border-bottom:1px solid #333;
  padding:6px;
  font-size:12px;
  vertical-align:top;
}
th{opacity:.8}

details summary{
  cursor:pointer;
  color:#8ab4ff;
}
pre{
  background:#000;
  padding:8px;
  border-radius:6px;
  margin:6px 0 0;
  white-space:pre-wrap;
  word-break:break-all;
  font-size:11px;
}

.calendar{
  display:grid;
  grid-template-columns: repeat(7,1fr);
  gap:6px;
  margin:10px 0 20px;
}
.day{
  border:1px solid #333;
  border-radius:6px;
  padding:6px;
  font-size:11px;
  min-height:46px;
}
.day strong{display:block;font-size:12px}
.day span{opacity:.7}
.day.today{border-color:#335dff}
</style>
</head>

<body>

<h2>🔐 管理画面</h2>

<div id="status">未ログイン</div>
<button id="login">管理者ログイン</button>
<button id="logout" style="display:none">ログアウト</button>

<hr>

<h3 id="count">総アクセス数：-</h3>
<button id="csv">📤 CSV ダウンロード</button>

<h3>🔍 フィルター</h3>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
  <input id="f-text" placeholder="キーワード（UA / referrer / anonId など）" style="flex:1;min-width:220px">
  <input id="f-date" type="date">
  <button id="f-clear">解除</button>
</div>

<h3>📊 日別アクセス（日本時間）</h3>
<div id="calendar" class="calendar"></div>

<h3>📋 アクセスログ（最新200件）</h3>
<table>
<thead>
<tr>
  <th>time</th>
  <th>anonId</th>
  <th>page → to</th>
  <th>referrer</th>
  <th>UserAgent</th>
  <th>detail</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* Firebase 設定 */
const firebaseConfig = {
  apiKey: "AIzaSyBBpOKnLNBz0qikWgl6zAGpRG8_o0LZEEc",
  authDomain: "endlees-accescounter.firebaseapp.com",
  projectId: "endlees-accescounter",
  storageBucket: "endlees-accescounter.firebasestorage.app",
  messagingSenderId: "70250476146",
  appId: "1:70250476146:web:cc95f3b7036fbbbc6408eb"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* UI */
const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("login");
const logoutBtn= document.getElementById("logout");
const countEl  = document.getElementById("count");
const rowsEl   = document.getElementById("rows");
const csvBtn   = document.getElementById("csv");
const calEl    = document.getElementById("calendar");

const fText  = document.getElementById("f-text");
const fDate  = document.getElementById("f-date");
const fClear = document.getElementById("f-clear");

/* ログ保持 */
let allLogs = [];

/* ログイン */
loginBtn.onclick = async ()=>{
  const email = prompt("管理者メール");
  const pass  = prompt("管理者パスワード");
  if(!email || !pass) return;
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch{
    alert("ログイン失敗");
  }
};

/* ログアウト */
logoutBtn.onclick = async ()=>{
  await signOut(auth);
};

/* 認証 */
onAuthStateChanged(auth, async user=>{
  rowsEl.innerHTML="";
  calEl.innerHTML="";

  if(!user){
    statusEl.textContent="未ログイン";
    loginBtn.style.display="";
    logoutBtn.style.display="none";
    countEl.textContent="総アクセス数：-";
    return;
  }

  statusEl.textContent=`ログイン中：${user.email}`;
  loginBtn.style.display="none";
  logoutBtn.style.display="";

  const stat = await getDoc(doc(db,"stats","access"));
  countEl.textContent="総アクセス数：" + (stat.data()?.count ?? 0);

  const q = query(
    collection(db,"access_logs"),
    orderBy("time","desc"),
    limit(200)
  );
  const snap = await getDocs(q);

  allLogs = [];
  snap.forEach(d=>allLogs.push(d.data()));

  applyFilter();
  renderCalendar(allLogs);
  setupCSV();
});

/* フィルター */
function applyFilter(){
  let logs = [...allLogs];

  const q = fText.value.trim().toLowerCase();
  if(q){
    logs = logs.filter(r =>
      [r.anonId,r.page,r.to,r.referrer,r.userAgent]
        .some(v => (v??"").toLowerCase().includes(q))
    );
  }

  if(fDate.value){
    logs = logs.filter(r=>{
      if(!r.time?.toDate) return false;
      const key = r.time.toDate().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
      return key === fDate.value;
    });
  }

  renderTable(logs);
}

fText.oninput = applyFilter;
fDate.onchange = applyFilter;
fClear.onclick = ()=>{
  fText.value="";
  fDate.value="";
  renderTable(allLogs);
};

/* テーブル */
function renderTable(logs){
  rowsEl.innerHTML="";
  logs.forEach(r=>{
    const t = r.time?.toDate?.().toLocaleString() ?? "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${t}</td>
      <td>${r.anonId??""}</td>
      <td>${r.page??""} → ${r.to??""}</td>
      <td>${(r.referrer??"").slice(0,40)}</td>
      <td style="word-break:break-all">${(r.userAgent??"").slice(0,80)}</td>
      <td>
        <details>
          <summary class="small">表示</summary>
          <pre>${JSON.stringify({...r,time:t},null,2)}</pre>
        </details>
      </td>`;
    rowsEl.appendChild(tr);
  });
}

/* カレンダー */
function renderCalendar(logs){
  calEl.innerHTML="";
  const map={};
  logs.forEach(r=>{
    if(!r.time?.toDate) return;
    const key = r.time.toDate().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
    map[key]=(map[key]||0)+1;
  });

  const today = new Date().toLocaleDateString("sv-SE",{timeZone:"Asia/Tokyo"});
  Object.keys(map).sort().reverse().forEach(d=>{
    const div=document.createElement("div");
    div.className="day"+(d===today?" today":"");
    div.innerHTML=`<strong>${d}</strong><span>${map[d]} 件</span>`;
    div.onclick=()=>{fDate.value=d;applyFilter();}
    calEl.appendChild(div);
  });
}

/* CSV（表示中のみ） */
function setupCSV(){
  csvBtn.onclick=()=>{
    const rows=[...rowsEl.querySelectorAll("tr")]
      .map(tr=>[...tr.children].slice(0,5).map(td=>td.innerText));
    const head=["time","anonId","page→to","referrer","userAgent"];
    const csv=[head,...rows].map(r=>`"${r.join('","')}"`).join("\n");
    const blob=new Blob([csv],{type:"text/csv"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="access_logs_filtered.csv";
    a.click();
  };
}
</script>

</body>
</html>
