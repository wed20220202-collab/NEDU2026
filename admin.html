<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
h2{margin-top:0}
button,select{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  font-weight:600;
}
button{
  background:#335dff;
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
#logout{background:#444;margin-left:8px}
.small{opacity:.7;font-size:12px}
.section{margin-top:22px}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border-bottom:1px solid #333;
  padding:6px;
  font-size:12px;
  vertical-align:top;
}
th{opacity:.8}
</style>
</head>

<body>

<h2>🔐 管理画面</h2>

<div id="status">未ログイン</div>
<button id="login">管理者ログイン</button>
<button id="logout" style="display:none">ログアウト</button>

<div class="section">
  <h3 id="count">総アクセス数：-</h3>
</div>

<div class="section">
  <h3>📢 サイト公開設定</h3>
  <select id="publishSelect">
    <option value="true">公開</option>
    <option value="false">非公開</option>
  </select>
  <button id="savePublish">保存</button>
</div>

<div class="section">
  <h3>📊 日別アクセス集計</h3>
  <table id="daily">
    <thead>
      <tr><th>日付</th><th>回数</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="section">
  <button id="csv">📤 CSV ダウンロード</button>
</div>

<div class="section">
  <h3>📋 アクセスログ（最新200件）</h3>
  <table>
    <thead>
      <tr>
        <th>time</th>
        <th>anonId</th>
        <th>page → to</th>
        <th>referrer</th>
        <th>UserAgent</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔧 Firebase 設定（index.html と同じ） */
const firebaseConfig = {
  apiKey: "AIzaSyBBpOKnLNBz0qikWgl6zAGpRG8_o0LZEEc",
  authDomain: "endlees-accescounter.firebaseapp.com",
  projectId: "endlees-accescounter",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* UI */
const statusEl = document.getElementById("status");
const loginBtn  = document.getElementById("login");
const logoutBtn = document.getElementById("logout");
const countEl   = document.getElementById("count");
const rowsEl    = document.getElementById("rows");
const dailyBody = document.querySelector("#daily tbody");
const csvBtn    = document.getElementById("csv");

/* ログイン */
loginBtn.onclick = async () => {
  const email = prompt("管理者メール");
  const pass  = prompt("管理者パスワード");
  if(!email || !pass) return;
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch{
    alert("ログイン失敗");
  }
};

/* ログアウト */
logoutBtn.onclick = () => signOut(auth);

/* 認証状態 */
onAuthStateChanged(auth, async (u)=>{
  rowsEl.innerHTML="";
  dailyBody.innerHTML="";

  if(!u){
    statusEl.textContent="未ログイン";
    loginBtn.style.display="";
    logoutBtn.style.display="none";
    countEl.textContent="総アクセス数：-";
    return;
  }

  statusEl.textContent=`ログイン中：${u.email}`;
  loginBtn.style.display="none";
  logoutBtn.style.display="";

  /* 総アクセス数 */
  const c = await getDoc(doc(db,"stats","access"));
  const total = c.exists() ? (c.data().count ?? 0) : 0;
  countEl.textContent = "総アクセス数：" + total;

  /* 公開設定 */
  const cfg = await getDoc(doc(db,"stats","config"));
  document.getElementById("publishSelect").value =
    cfg.exists() ? String(cfg.data().publish) : "true";

  /* ログ取得 */
  const q = query(
    collection(db,"access_logs"),
    orderBy("time","desc"),
    limit(200)
  );
  const snap = await getDocs(q);

  const logs = [];
  snap.forEach(d => logs.push(d.data()));

  renderLogs(logs);
  renderDaily(logs);
  setupCSV(logs);
});

/* ログ表示 */
function renderLogs(logs){
  rowsEl.innerHTML="";
  logs.forEach(r=>{
    const tr=document.createElement("tr");
    const t=r.time?.toDate?.().toLocaleString() ?? "";
    tr.innerHTML=`
      <td>${t}</td>
      <td>${r.anonId ?? ""}</td>
      <td>${r.page ?? ""} → ${r.to ?? ""}</td>
      <td>${(r.referrer ?? "").slice(0,40)}</td>
      <td style="word-break:break-all">${(r.userAgent ?? "").slice(0,120)}</td>
    `;
    rowsEl.appendChild(tr);
  });
}

/* 日別集計 */
function renderDaily(logs){
  const map={};
  logs.forEach(r=>{
    if(!r.time?.toDate) return;
    const d=r.time.toDate().toISOString().slice(0,10);
    map[d]=(map[d]||0)+1;
  });
  Object.keys(map).sort().forEach(d=>{
    dailyBody.innerHTML+=`<tr><td>${d}</td><td>${map[d]}</td></tr>`;
  });
}

/* CSV */
function setupCSV(logs){
  csvBtn.onclick=()=>{
    const head=["time","anonId","page","to","referrer","userAgent"];
    const rows=logs.map(r=>[
      r.time?.toDate?.().toISOString() ?? "",
      r.anonId ?? "",
      r.page ?? "",
      r.to ?? "",
      r.referrer ?? "",
      (r.userAgent ?? "").replace(/"/g,'""')
    ]);
    const csv=[head,...rows].map(r=>`"${r.join('","')}"`).join("\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download="access_logs.csv";
    a.click();
  };
}

/* 公開設定保存 */
document.getElementById("savePublish").onclick=async ()=>{
  const v=document.getElementById("publishSelect").value==="true";
  await setDoc(doc(db,"stats","config"),{publish:v},{merge:true});
  alert("保存しました");
};
</script>

</body>
</html>
