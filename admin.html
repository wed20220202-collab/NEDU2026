<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: system-ui, sans-serif;
  background:#111;
  color:#fff;
  padding:20px;
}
h2,h3{margin-top:0}
button{
  padding:8px 14px;
  border:0;
  border-radius:8px;
  background:#335dff;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
button:hover{opacity:.9}
#logout{background:#444;margin-left:8px}
.small{opacity:.7;font-size:12px}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
th,td{
  border-bottom:1px solid #333;
  padding:6px;
  font-size:12px;
  vertical-align:top;
}
th{opacity:.8}

details summary{
  cursor:pointer;
  color:#8ab4ff;
}
pre{
  background:#000;
  padding:8px;
  border-radius:6px;
  margin:6px 0 0;
  white-space:pre-wrap;
  word-break:break-all;
  font-size:11px;
}
</style>
</head>

<body>

<h2>🔐 管理画面</h2>

<div id="status">未ログイン</div>
<button id="login">管理者ログイン</button>
<button id="logout" style="display:none">ログアウト</button>

<hr>

<h3 id="count">総アクセス数：-</h3>

<button id="csv">📤 CSV ダウンロード</button>

<h3>📋 アクセスログ（最新200件）</h3>
<table>
<thead>
<tr>
  <th>time</th>
  <th>anonId</th>
  <th>page → to</th>
  <th>referrer</th>
  <th>UserAgent</th>
  <th>detail</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy,
  limit
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* Firebase 設定 */
const firebaseConfig = {
  apiKey: "AIzaSyBBpOKnLNBz0qikWgl6zAGpRG8_o0LZEEc",
  authDomain: "endlees-accescounter.firebaseapp.com",
  projectId: "endlees-accescounter",
  storageBucket: "endlees-accescounter.firebasestorage.app",
  messagingSenderId: "70250476146",
  appId: "1:70250476146:web:cc95f3b7036fbbbc6408eb",
  measurementId: "G-T2XD6N46Z8"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

/* UI */
const statusEl = document.getElementById("status");
const loginBtn = document.getElementById("login");
const logoutBtn= document.getElementById("logout");
const countEl  = document.getElementById("count");
const rowsEl   = document.getElementById("rows");
const csvBtn   = document.getElementById("csv");

/* ログイン */
loginBtn.onclick = async () => {
  const email = prompt("管理者メール");
  const pass  = prompt("管理者パスワード");
  if(!email || !pass) return;
  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch{
    alert("ログイン失敗");
  }
};

/* ログアウト */
logoutBtn.onclick = async () => {
  await signOut(auth);
};

/* 認証状態 */
onAuthStateChanged(auth, async user=>{
  rowsEl.innerHTML = "";
  if(!user){
    statusEl.textContent = "未ログイン";
    loginBtn.style.display = "";
    logoutBtn.style.display = "none";
    countEl.textContent = "総アクセス数：-";
    return;
  }

  statusEl.textContent = `ログイン中：${user.email}`;
  loginBtn.style.display = "none";
  logoutBtn.style.display = "";

  /* 総アクセス数 */
  const stat = await getDoc(doc(db,"stats","access"));
  const total = stat.exists() ? stat.data().count ?? 0 : 0;
  countEl.textContent = "総アクセス数：" + total;

  /* ログ取得 */
  const q = query(
    collection(db,"access_logs"),
    orderBy("time","desc"),
    limit(200)
  );
  const snap = await getDocs(q);

  const logs = [];
  snap.forEach(d=>logs.push(d.data()));

  renderTable(logs);
  setupCSV(logs);
});

/* テーブル描画（全フィールド対応） */
function renderTable(logs){
  rowsEl.innerHTML = "";

  logs.forEach(r=>{
    const tr = document.createElement("tr");
    const t  = r.time?.toDate?.().toLocaleString() ?? "";

    const all = {
      ...r,
      time: t
    };

    tr.innerHTML = `
      <td>${t}</td>
      <td>${r.anonId ?? ""}</td>
      <td>${r.page ?? ""} → ${r.to ?? ""}</td>
      <td>${(r.referrer ?? "").slice(0,40)}</td>
      <td style="word-break:break-all">
        ${(r.userAgent ?? "").slice(0,80)}
      </td>
      <td>
        <details>
          <summary class="small">表示</summary>
          <pre>${JSON.stringify(all,null,2)}</pre>
        </details>
      </td>
    `;
    rowsEl.appendChild(tr);
  });
}

/* CSV（主要項目） */
function setupCSV(logs){
  csvBtn.onclick = ()=>{
    const head = ["time","anonId","page","to","referrer","userAgent"];
    const rows = logs.map(r=>[
      r.time?.toDate?.().toISOString() ?? "",
      r.anonId ?? "",
      r.page ?? "",
      r.to ?? "",
      r.referrer ?? "",
      (r.userAgent ?? "").replace(/"/g,'""')
    ]);

    const csv = [head,...rows]
      .map(r=>`"${r.join('","')}"`).join("\n");

    const blob = new Blob([csv],{type:"text/csv"});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url;
    a.download = "access_logs.csv";
    a.click();
    URL.revokeObjectURL(url);
  };
}
</script>

</body>
</html>
